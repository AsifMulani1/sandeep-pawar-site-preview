<div class="wrap">
	<header class="page-head">
		<h1>Ask a question</h1>
		<p>Ask what you would ask a senior colleague if you could. Some questions are answered on this site. Your name is never published, and you do not need to give it.</p>
	</header>

	<form class="ask-form" action="/sandeep-pawar-site-preview/api/method/sp_site.api.ask" method="post" data-async data-replace
		data-done="Thank you. Your question has been received. If it is answered on the site, it will appear without your name.">
		<div>
			<label for="ask-question">Your question
				<span class="hint">A few sentences of context help. Between 15 and 2000 characters.</span>
			</label>
			<textarea class="field" id="ask-question" name="question" required minlength="15" maxlength="2000" rows="7"></textarea>
		</div>
		<div>
			<label for="ask-about">About you <span class="hint">Optional. For example: final-year B.Com student, Pune. Please leave out your name.</span></label>
			<input class="field" id="ask-about" type="text" name="about_reader" maxlength="140" autocomplete="off">
		</div>
		<div class="honeypot" aria-hidden="true">
			<label for="ask-website">Leave this empty</label>
			<input id="ask-website" type="text" name="website" tabindex="-1" autocomplete="off">
		</div>
		<div>
			<button class="button" type="submit">Send question</button>
			<p class="form-status" role="status" aria-live="polite"></p>
		</div>
	</form>
</div>
